<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>발표 스크립트 뷰어</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #121212; color: #fff; }
    .wrap { padding: 20px; display: grid; gap: 16px; }
    h1 { margin: 0; font-size: 20px; }
    textarea { width: 100%; min-height: 60vh; resize: vertical; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #1e1e1e; color: #fff; }
    .controls { display: flex; gap: 12px; }
    button { padding: 10px 14px; border: none; border-radius: 8px; background: #2d6cdf; color: #fff; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>발표 스크립트</h1>
    <div class="controls">
      <button id="prevBtn">◀ 이전</button>
      <button id="nextBtn">다음 ▶</button>
    </div>
    <textarea placeholder="여기에 발표 스크립트를 작성하세요."></textarea>
  </div>
  <script src="./script.js"></script>
</body>
</html>
