<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HTML 뷰어</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; background: #000; overflow: hidden; }
    #viewerFrame { width: 100%; height: 100%; border: 0; }
    #dropHint {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.6); color: #fff; font: 700 24px/1 Arial,sans-serif; pointer-events: none; opacity: 0; transition: opacity .2s;
    }
    #status { position: fixed; left: 12px; bottom: 12px; color: #ddd; font: 12px Arial,sans-serif; background: rgba(0,0,0,.5); padding: 6px 8px; border-radius: 6px; }
  </style>
</head>
<body>
  <iframe id="viewerFrame" src="../index.html"></iframe>
  <div id="dropHint">HTML 파일을 여기에 드래그 앤 드롭하세요</div>
  <div id="status">현재: 기본 index.html</div>
  <script src="./viewer-shell.js"></script>
</body>
</html>
